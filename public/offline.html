<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#a855f7" />
    <title>Hors ligne - Soussou Souvenirs</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
        background: linear-gradient(135deg, #fdf2f8 0%, #fce7f3 50%, #ddd6fe 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .container {
        background: white;
        border-radius: 24px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
        padding: 48px;
        max-width: 500px;
        text-align: center;
      }

      .icon {
        width: 120px;
        height: 120px;
        margin: 0 auto 32px;
        background: linear-gradient(135deg, #a855f7 0%, #ec4899 100%);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .icon svg {
        width: 60px;
        height: 60px;
        color: white;
      }

      h1 {
        font-size: 32px;
        color: #1f2937;
        margin-bottom: 16px;
        font-weight: 700;
      }

      p {
        color: #6b7280;
        font-size: 18px;
        line-height: 1.6;
        margin-bottom: 32px;
      }

      .button {
        display: inline-block;
        background: linear-gradient(135deg, #a855f7 0%, #ec4899 100%);
        color: white;
        text-decoration: none;
        padding: 16px 32px;
        border-radius: 16px;
        font-weight: 600;
        font-size: 16px;
        transition: transform 0.2s;
      }

      .button:hover {
        transform: scale(1.05);
      }

      .status {
        margin-top: 24px;
        padding: 16px;
        background: #fef2f2;
        border-radius: 12px;
        color: #991b1b;
        font-size: 14px;
      }

      .status.online {
        background: #f0fdf4;
        color: #166534;
      }

      @media (max-width: 640px) {
        .container {
          padding: 32px 24px;
        }

        h1 {
          font-size: 24px;
        }

        p {
          font-size: 16px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 2.829a4.978 4.978 0 01-1.414-2.83m-1.414 5.658a9 9 0 01-2.167-9.238m7.824 2.167a1 1 0 111.414 1.414m-1.414-1.414L3 3" />
        </svg>
      </div>

      <h1>Vous êtes hors ligne</h1>

      <p>
        Pas de souci ! L'application fonctionne en mode hors ligne.
        Vos souvenirs seront automatiquement synchronisés lorsque vous serez de nouveau en ligne.
      </p>

      <a href="/" class="button">Retour à l'application</a>

      <div id="status" class="status">
        Statut : Hors ligne
      </div>
    </div>

    <script>
      // Update status based on connection
      function updateStatus() {
        const statusEl = document.getElementById('status');
        if (navigator.onLine) {
          statusEl.className = 'status online';
          statusEl.textContent = 'Statut : En ligne - Rechargement...';
          setTimeout(() => {
            window.location.href = '/';
          }, 1000);
        } else {
          statusEl.className = 'status';
          statusEl.textContent = 'Statut : Hors ligne';
        }
      }

      // Listen for online/offline events
      window.addEventListener('online', updateStatus);
      window.addEventListener('offline', updateStatus);

      // Check status on load
      updateStatus();
    </script>
  </body>
</html>
