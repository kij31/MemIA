<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="PWA pour la collecte d'enregistrements Audio, Vidéo, Images et Textes">
    <meta name="theme-color" content="#2196F3">
    <title>MemIA - Collecte Multimédia</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icons/icon-192x192.svg">
</head>
<body>
    <div class="container">
        <header>
            <h1>📱 MemIA</h1>
            <p class="subtitle">Collecte d'enregistrements multimédia</p>
        </header>

        <main>
            <!-- Section Audio -->
            <section class="media-section">
                <h2>🎤 Audio</h2>
                <button id="audioBtn" class="capture-btn">Enregistrer Audio</button>
                <div id="audioStatus" class="status"></div>
                <audio id="audioPlayback" controls style="display:none;"></audio>
            </section>

            <!-- Section Vidéo -->
            <section class="media-section">
                <h2>🎥 Vidéo</h2>
                <button id="videoBtn" class="capture-btn">Enregistrer Vidéo</button>
                <div id="videoStatus" class="status"></div>
                <video id="videoPreview" controls style="display:none;"></video>
            </section>

            <!-- Section Image -->
            <section class="media-section">
                <h2>📷 Image</h2>
                <button id="imageBtn" class="capture-btn">Prendre une Photo</button>
                <input type="file" id="imageInput" accept="image/*" capture="environment" style="display:none;">
                <div id="imageStatus" class="status"></div>
                <img id="imagePreview" style="display:none; max-width:100%; margin-top:10px;">
            </section>

            <!-- Section Texte -->
            <section class="media-section">
                <h2>📝 Texte</h2>
                <textarea id="textInput" placeholder="Entrez votre texte ici..." rows="5"></textarea>
                <button id="textBtn" class="capture-btn">Sauvegarder Texte</button>
                <div id="textStatus" class="status"></div>
            </section>

            <!-- Lecteur média -->
            <div id="playerContainer" style="display:none; margin:20px 0;"></div>

            <!-- Liste des enregistrements -->
            <section class="media-section">
                <div class="recordings-header">
                    <h2>📋 Mes Enregistrements</h2>
                    <div class="filter-controls">
                        <label for="groupBySelect">Organiser par :</label>
                        <select id="groupBySelect" class="group-select">
                            <option value="date">Date</option>
                            <option value="contributeur">Contributeur</option>
                            <option value="status">Statut</option>
                        </select>
                    </div>
                </div>
                <div id="recordingsList" class="recordings-list"></div>
            </section>
        </main>

        <footer>
            <p id="installMessage" style="display:none;">
                💡 Vous pouvez installer cette app sur votre appareil !
            </p>
        </footer>
    </div>

    <!-- Modal de validation -->
    <div id="validationModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>✓ Validation de l'enregistrement</h2>
                <span id="modalClose" class="modal-close">&times;</span>
            </div>
            <form id="validationForm">
                <div class="form-group">
                    <label for="nomContributeur">Nom <span class="required">*</span></label>
                    <input
                        type="text"
                        id="nomContributeur"
                        list="nomSuggestions"
                        required
                        placeholder="Nom du contributeur"
                    >
                    <datalist id="nomSuggestions"></datalist>
                </div>

                <div class="form-group">
                    <label for="prenomContributeur">Prénom</label>
                    <input
                        type="text"
                        id="prenomContributeur"
                        placeholder="Prénom du contributeur"
                    >
                </div>

                <div class="form-group">
                    <label for="occasionEvenement">Occasion <span class="required">*</span></label>
                    <select id="occasionEvenement" required>
                        <option value="">-- Sélectionner une occasion --</option>
                        <option value="Mariage">Mariage</option>
                        <option value="Anniversaire">Anniversaire</option>
                        <option value="Baptême">Baptême</option>
                        <option value="Communion">Communion</option>
                        <option value="Fête familiale">Fête familiale</option>
                        <option value="Réunion">Réunion</option>
                        <option value="Conférence">Conférence</option>
                        <option value="Interview">Interview</option>
                        <option value="Témoignage">Témoignage</option>
                        <option value="Formation">Formation</option>
                        <option value="Autre">Autre</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="dateEvenement">Date de l'événement</label>
                    <input
                        type="date"
                        id="dateEvenement"
                    >
                </div>

                <div class="form-group">
                    <label for="lieuEvenement">Lieu de l'événement</label>
                    <input
                        type="text"
                        id="lieuEvenement"
                        placeholder="Ville, pays..."
                    >
                </div>

                <div class="form-actions">
                    <button type="button" class="btn-cancel" onclick="closeModal()">Annuler</button>
                    <button type="submit" class="btn-submit">Valider ✓</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Popup de confirmation de validation -->
    <div id="confirmValidationPopup" class="popup-overlay">
        <div class="popup-content">
            <div class="popup-icon">✅</div>
            <h3>Enregistrement sauvegardé !</h3>
            <p>Voulez-vous valider cet enregistrement maintenant ?</p>
            <div class="popup-actions">
                <button id="popupNo" class="popup-btn popup-btn-secondary">Plus tard</button>
                <button id="popupYes" class="popup-btn popup-btn-primary">Valider maintenant</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
