<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="PWA pour la collecte d'enregistrements Audio, Vidéo, Images et Textes">
    <meta name="theme-color" content="#2196F3">
    <title>MemIA - Collecte Multimédia</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icons/icon-192x192.svg">
</head>
<body>
    <div class="container">
        <header>
            <h1>📱 MemIA</h1>
            <p class="subtitle">Collecte d'enregistrements multimédia</p>
        </header>

        <main>
            <!-- Bouton Nouvel Enregistrement -->
            <section class="media-section" style="text-align:center;">
                <button id="newRecordingBtn" class="btn-new-recording">
                    ➕ Nouvel Enregistrement
                </button>
                <p style="color:#666; margin-top:10px; font-size:14px;">
                    Créez un enregistrement, puis ajoutez des médias (audio, vidéo, image, texte)
                </p>
            </section>

            <!-- Section Audio -->
            <section class="media-section">
                <h2>🎤 Audio</h2>
                <button id="audioBtn" class="capture-btn">Enregistrer Audio</button>
                <div id="audioStatus" class="status"></div>
            </section>

            <!-- Section Vidéo -->
            <section class="media-section">
                <h2>🎥 Vidéo</h2>
                <button id="videoBtn" class="capture-btn">Enregistrer Vidéo</button>
                <div id="videoStatus" class="status"></div>
            </section>

            <!-- Section Image -->
            <section class="media-section">
                <h2>📷 Image</h2>
                <button id="imageBtn" class="capture-btn">Prendre une Photo</button>
                <input type="file" id="imageInput" accept="image/*" capture="environment" style="display:none;">
                <div id="imageStatus" class="status"></div>
            </section>

            <!-- Section Texte -->
            <section class="media-section">
                <h2>📝 Texte</h2>
                <textarea id="textInput" placeholder="Entrez votre texte ici..." rows="5"></textarea>
                <button id="textBtn" class="capture-btn">Sauvegarder Texte</button>
                <div id="textStatus" class="status"></div>
            </section>

            <!-- Liste des enregistrements -->
            <section class="media-section">
                <div class="recordings-header">
                    <h2>📋 Mes Enregistrements</h2>
                    <div class="filter-controls">
                        <label for="groupBySelect">Organiser par :</label>
                        <select id="groupBySelect" class="group-select">
                            <option value="date">Date</option>
                            <option value="contributeur">Contributeur</option>
                            <option value="status">Statut</option>
                        </select>
                    </div>
                </div>
                <div id="recordingsList" class="recordings-list"></div>
            </section>
        </main>

        <footer>
            <p id="installMessage" style="display:none;">
                💡 Vous pouvez installer cette app sur votre appareil !
            </p>
        </footer>
    </div>

    <!-- Modal du Formulaire d'Enregistrement -->
    <div id="recordingFormModal" class="modal">
        <div class="modal-content modal-large">
            <div class="modal-header">
                <h2>📦 Enregistrement Complet</h2>
                <span id="formClose" class="modal-close">&times;</span>
            </div>

            <div class="modal-body">
                <!-- Zone de lecture -->
                <div id="formPlayerContainer" style="display:none; margin-bottom:20px;"></div>

                <!-- Médias -->
                <div id="formMediasContainer"></div>

                <!-- Métadonnées -->
                <div class="form-metadata">
                    <h3>✓ Métadonnées de validation</h3>

                    <div class="form-group">
                        <label for="formNom">Nom *</label>
                        <input type="text" id="formNom" placeholder="Nom du contributeur">
                    </div>

                    <div class="form-group">
                        <label for="formPrenom">Prénom</label>
                        <input type="text" id="formPrenom" placeholder="Prénom du contributeur">
                    </div>

                    <div class="form-group">
                        <label for="formOccasion">Occasion *</label>
                        <select id="formOccasion">
                            <option value="">-- Sélectionner --</option>
                            <option value="Mariage">Mariage</option>
                            <option value="Anniversaire">Anniversaire</option>
                            <option value="Baptême">Baptême</option>
                            <option value="Communion">Communion</option>
                            <option value="Fête familiale">Fête familiale</option>
                            <option value="Réunion">Réunion</option>
                            <option value="Conférence">Conférence</option>
                            <option value="Interview">Interview</option>
                            <option value="Témoignage">Témoignage</option>
                            <option value="Formation">Formation</option>
                            <option value="Autre">Autre</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="formDateEvenement">Date de l'événement</label>
                        <input type="date" id="formDateEvenement">
                    </div>

                    <div class="form-group">
                        <label for="formLieuEvenement">Lieu de l'événement</label>
                        <input type="text" id="formLieuEvenement" placeholder="Ville, pays...">
                    </div>
                </div>

                <!-- Actions -->
                <div class="form-actions-bottom">
                    <button id="formDelete" class="btn-delete-full">🗑️ Supprimer tout</button>
                    <button id="formSave" class="btn-validate-full">✓ Valider l'enregistrement</button>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
